<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      .logo-text { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: 58px; fill: #1d3557; }
      .sub-text { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 4px; fill: #e63946; }
      .icon-red { stroke: #e63946; fill: none; stroke-width: 6; stroke-linecap: round; }
      .icon-blue { fill: #1d3557; }
    </style>
  </defs>

  <!-- İkon Kısmı (7 ve İngiliz Anahtarlı G Harfi) -->
  <g transform="translate(10, 10)">
    <!-- Dış Çember -->
    <path d="M 80 15 A 45 45 0 1 0 85 90" class="icon-red"/>
    
    <!-- 7 Rakamı -->
    <polygon points="25,25 75,25 50,85 35,85 55,40 25,40" class="icon-blue"/>
    
    <!-- İngiliz Anahtarı (G Harfi Temsili) -->
    <circle cx="70" cy="65" r="18" class="icon-blue" />
    <circle cx="70" cy="65" r="8" fill="#ffffff" />
    <!-- Anahtar Ağzı Boşluğu -->
    <polygon points="90,52 68,65 90,78" fill="#ffffff" />
    <rect x="45" y="58" width="15" height="14" class="icon-blue" />
  </g>

  <!-- Yazı Kısmı -->
  <text x="120" y="65" class="logo-text">YEDİGÜN</text>
  
  <!-- Teknik Servis ve Yan Çizgiler (Orta Dişli Kaldırıldı, Yazı Ortalama Ayarlandı) -->
  <line x1="125" y1="90" x2="160" y2="90" class="icon-red" stroke-width="3"/>
  <text x="180" y="96" class="sub-text">TEKNİK SERVİS</text>
  <line x1="365" y1="90" x2="400" y2="90" class="icon-red" stroke-width="3"/>
</svg>
